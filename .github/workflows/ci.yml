name: checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58
    steps:
      - uses: actions/checkout@v4
      - name: Install locked dependencies
        run: uv sync --frozen --group dev
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Format
        run: uv run --frozen ruff format --check .
      - name: Unit tests (no external calls)
        run: uv run --frozen pytest -q
      - name: Requirement and plan integrity
        run: python scripts/check_documents.py
