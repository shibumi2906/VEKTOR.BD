[project]
name = "pinui-rag"
version = "0.1.0"
description = "Hebrew document retrieval with multilingual evidence-based answers"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.121.3", "starlette==0.50.0", "pydantic==2.11.7", "pydantic-settings==2.10.1",
  "uvicorn==0.32.1", "httpx==0.28.1", "SQLAlchemy==2.0.36",
  "asyncpg>=0.30,<1", "alembic>=1.14,<2", "qdrant-client>=1.15,<2",
  "loguru==0.7.2", "streamlit==1.58.0", "python-multipart==0.0.20",
  "pypdf==5.9.0", "pdfplumber==0.11.10",
  "onnxruntime>=1.20,<2", "tokenizers>=0.21,<1", "huggingface-hub>=0.30,<2",
]

[dependency-groups]
dev = ["pytest==8.3.4", "pytest-asyncio==0.26.0", "ruff>=0.9,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
